      +css+"\n"
      +fontLink+"\n"
      +"</head>\n<body>\n"
      +'<div id="root"></div>\n'
      +'<script id="lyon-crm-data" type="application/json">'+json+"<\/script>\n"
      +"<script>\n("+src+")(JSON.parse(document.getElementById('lyon-crm-data').textContent));\n<\/script>\n"
      +"</body>\n</html>";
    return html;
  }

  function persist(newLeads,successMsg){
    if(readOnly||!artifactApi){
      state.leads=newLeads;
      render();
      if(!artifactApi)showToast("Cambio guardado solo en esta sesion (sin conexion de guardado).");
      return;
    }
    saving=true;render();
    artifactApi.publish(buildFullHtml(newLeads)).then(function(){
      // successful publish reloads this view automatically
    }).catch(function(err){
      saving=false;
      var code=err&&err.code;
      if(code==="conflict"){return;}
      if(code==="not_writer"||code==="not_granted"||code==="capability_disabled"||code==="not_declared"){
        readOnly=true;showToast("Esta vista es de solo lectura. Tus cambios no se guardaron.");render();return;
      }
      showToast("No se pudo guardar"+(err&&err.message?": "+err.message:"")+". Intenta de nuevo.");
      render();
    });
  }

  function upsertLead(lead){
    var leads=state.leads.slice();
    var idx=leads.findIndex(function(l){return l.id===lead.id});
    if(idx>=0)leads[idx]=lead;else leads.push(lead);
    persist(leads);
  }

  function deleteLead(id){
    if(!window.confirm("¿Eliminar este lead? No se puede deshacer."))return;
    persist(state.leads.filter(function(l){return l.id!==id}));
  }

  function setEtapa(id,etapa){
    var leads=state.leads.map(function(l){
      if(l.id!==id)return l;
      var copy=Object.assign({},l,{etapa:etapa});
      if(etapa!=="NUEVO"&&!copy.ultimoContacto)copy.ultimoContacto=todayIso();
      return copy;
    });
    persist(leads);
  }

  function exportCsv(){
    var headers=["Fecha","Nombre","Negocio","Ciudad","WhatsApp","Fuente","Tipo","Tiene Web","Instagram/FB","Resenas","Notas","Score","Etapa","Ultimo Contacto","Proxima Accion","Proxima Fecha","Paquete Propuesto"];
    function q(v){
      v=v==null?"":String(v);
      if(/[",\n]/.test(v))return '"'+v.replace(/"/g,'""')+'"';
      return v;
    }
    var rows=[headers.join(",")];
    state.leads.forEach(function(l){
      rows.push([l.fecha,l.nombre,l.negocio,l.ciudad,l.whatsapp,l.fuente,l.tipo,l.tieneWeb,l.redes,l.resenas,l.notas,l.score,l.etapa,l.ultimoContacto,l.proximaAccion,l.proximaFecha,l.paquete].map(q).join(","));
    });
    var csv=rows.join("\n");
    if(window.claude&&artifactApi!==undefined){
      window.claude.use("downloads").then(function(dl){
        if(!dl){fallbackDownload(csv);return;}
        dl.save({filename:"crm-lyon.csv",data:csv}).catch(function(err){
          if(err&&err.code==="declined")return;
          fallbackDownload(csv);
        });
      }).catch(function(){fallbackDownload(csv)});
    }else{
      fallbackDownload(csv);
    }
  }

  function fallbackDownload(csv){
    try{
      var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;a.download="crm-lyon.csv";document.body.appendChild(a);a.click();
      document.body.removeChild(a);URL.revokeObjectURL(url);
    }catch(e){showToast("No se pudo exportar el CSV en este entorno.")}
  }

  function filteredSortedLeads(){
    var q=ui.search.trim().toLowerCase();
    var list=state.leads.filter(function(l){
      if(ui.etapaFiltro!=="TODAS"&&l.etapa!==ui.etapaFiltro)return false;
      if(ui.ciudadFiltro!=="TODAS"&&(l.ciudad||"Sin ciudad")!==ui.ciudadFiltro)return false;
      if(!q)return true;
      return (l.nombre+" "+l.negocio+" "+l.whatsapp+" "+l.notas).toLowerCase().indexOf(q)!==-1;
    });
    list.sort(function(a,b){
      var av=a.proximaFecha||"9999-99-99";
      var bv=b.proximaFecha||"9999-99-99";
      if(av<bv)return ui.sortDir==="asc"?-1:1;
      if(av>bv)return ui.sortDir==="asc"?1:-1;
      return 0;
    });
    return list;
  }

  function nextDateClass(iso){
    if(!iso)return "next-later";
    var d=daysUntil(iso);
    if(d<0)return "next-overdue";
    if(d===0)return "next-today";
    if(d<=2)return "next-soon";
    return "next-later";
  }

  function nextDateLabel(iso){
    if(!iso)return "Sin fecha";
    var d=daysUntil(iso);
    var base=fmtDateShort(iso);
    if(d<0)return base+" (vencido "+Math.abs(d)+"d)";
    if(d===0)return base+" (hoy)";
    if(d===1)return base+" (mañana)";
    return base;
  }

  function renderKpis(k){
    var tiles=[
      {label:"Nuevos (7 dias)",value:k.nuevos7,note:"Entraron esta semana"},
      {label:"Calificados",value:k.calificados,note:"Score 25 o mas"},
      {label:"En seguimiento",value:k.seguimiento,note:"Corriendo secuencia"},
      {label:"Agendados",value:k.agendados,note:"Llamada en calendario"},
      {label:"Tasa de cierre",value:(k.tasa===null?"—":k.tasa+"%"),note:"Cerrados / calificados"},
      {label:"MRR acumulado",value:fmtMxn(k.mrr),note:k.cerrados+" cliente(s) activos"}
    ];
    return tiles.map(function(t){
      return '<div class="kpi"><div class="kpi-label">'+escapeHtml(t.label)+'</div>'
        +'<div class="kpi-value">'+escapeHtml(String(t.value))+'</div>'
        +'<div class="kpi-note">'+escapeHtml(t.note)+'</div></div>';
    }).join("");
  }

  function renderEtapaSelect(l){
    return '<select class="etapa-select" style="'+etapaColors(l.etapa)+'" data-action="etapa" data-id="'+l.id+'" aria-label="Cambiar etapa">'
      +ETAPAS.map(function(e){
        return '<option value="'+e+'"'+(e===l.etapa?" selected":"")+'>'+e+'</option>';
      }).join("")
      +'</select>';
  }

  function renderRow(l){
    var band=scoreBand(l.score);
    var waDigits=(l.whatsapp||"").replace(/[^0-9]/g,"");
    var waLink=waDigits?'<a class="wa-link" target="_blank" rel="noopener" href="https://wa.me/'+waDigits+'">'+escapeHtml(l.whatsapp)+'</a>':'<span class="mono">'+escapeHtml(l.whatsapp)+'</span>';
    return '<tr>'
      +'<td class="mono">'+escapeHtml(fmtDateShort(l.fecha))+'</td>'
      +'<td class="cell-lead"><strong>'+escapeHtml(l.nombre)+'</strong><span>'+escapeHtml(l.negocio)+'</span></td>'
      +'<td>'+waLink+'</td>'
      +'<td class="mono">'+escapeHtml(l.ciudad||"Sin ciudad")+'</td>'
      +'<td><span class="badge badge-neutral">'+escapeHtml(l.tipo)+'</span><br><span style="font-size:.75rem;color:var(--ink-faint)">'+escapeHtml(l.fuente)+'</span></td>'
      +'<td><span class="badge '+(l.tieneWeb==="No"?"badge-warn":"badge-neutral")+'">'+escapeHtml(l.tieneWeb)+'</span></td>'
      +'<td class="mono" style="max-width:160px;overflow:hidden;text-overflow:ellipsis" title="'+escapeHtml(l.resenas||"Sin resenas")+'">'+escapeHtml(l.resenas||"Sin resenas")+'</td>'
      +'<td><span class="score-chip '+band.cls+'">'+escapeHtml(String(l.score))+'/50</span><span class="score-cap">'+band.cap+'</span></td>'
      +'<td>'+renderEtapaSelect(l)+'</td>'
      +'<td><span class="next-date '+nextDateClass(l.proximaFecha)+'">'+escapeHtml(nextDateLabel(l.proximaFecha))+'</span><span class="next-action">'+escapeHtml(l.proximaAccion||"—")+'</span></td>'
      +'<td class="row-actions">'
        +'<button class="btn btn-sm" data-action="edit" data-id="'+l.id+'">Editar</button>'
        +'<button class="btn btn-sm btn-danger" data-action="delete" data-id="'+l.id+'">Eliminar</button>'
      +'</td>'
      +'</tr>';
  }

  function renderApp(){
    var leads=filteredSortedLeads();
    var kpis=computeKpis(state.leads);
    var tableOrEmpty;
    if(state.leads.length===0){
      tableOrEmpty='<div class="empty-state"><h3>Todavia no hay leads.</h3><p>Agrega el primero de tus fuentes vivas: Google Maps, Habitissimo, StarOfService o tu Instagram.</p>'
        +'<button class="btn btn-primary" data-action="add">+ Nuevo lead</button></div>';
    }else if(leads.length===0){
      tableOrEmpty='<div class="empty-state"><h3>Nada con esos filtros.</h3><p>Cambia la busqueda o la etapa.</p></div>';
    }else{
      tableOrEmpty='<div class="table-wrap"><table class="leads"><thead><tr>'
        +'<th>Fecha</th><th>Lead</th><th>WhatsApp</th><th>Ciudad</th><th>Tipo / Fuente</th><th>Web</th><th>Resenas</th><th>Score</th><th>Etapa</th><th>Proxima accion</th><th></th>'
        +'</tr></thead><tbody>'+leads.map(renderRow).join("")+'</tbody></table></div>';
    }
    var todayLabel=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    var html=''
      +'<div class="wrap">'
      +'<div class="topbar"><div class="brand"><h1>Tablero <span>LYON</span></h1><p>Contratistas · Roofers · Remodeladores — Mexico</p></div>'
      +'<div class="today">'+escapeHtml(todayLabel)+'</div></div>'
      +'<p class="harvey-line">Ordena por proxima fecha cada mañana y trabaja de arriba hacia abajo. Ese es tu CRM completo.</p>'
      +(readOnly?'<div class="readonly-banner">Vista de solo lectura: tus cambios no se van a guardar aqui.</div>':'')
      +'<div class="kpis">'+renderKpis(kpis)+'</div>'
      +'<div class="toolbar">'
        +'<input type="search" id="search-input" placeholder="Buscar por nombre, negocio o whatsapp" value="'+escapeHtml(ui.search)+'">'
        +'<select id="etapa-filter">'
          +'<option value="TODAS"'+(ui.etapaFiltro==="TODAS"?" selected":"")+'>Todas las etapas</option>'
          +ETAPAS.map(function(e){return '<option value="'+e+'"'+(ui.etapaFiltro===e?" selected":"")+'>'+e+'</option>'}).join("")
        +'</select>'
        +'<select id="ciudad-filter">'
          +'<option value="TODAS"'+(ui.ciudadFiltro==="TODAS"?" selected":"")+'>Todas las ciudades</option>'
          +ciudadesDisponibles().map(function(c){return '<option value="'+escapeHtml(c)+'"'+(ui.ciudadFiltro===c?" selected":"")+'>'+escapeHtml(c)+'</option>'}).join("")
        +'</select>'
        +'<div class="spacer"></div>'
        +'<button class="btn" data-action="export">Exportar CSV</button>'
        +'<button class="btn btn-primary" data-action="add"'+(readOnly?" disabled":"")+'>+ Nuevo lead</button>'
      +'</div>'
      +tableOrEmpty
      +'</div>'
      +'<div id="toast" class="toast"></div>'
      +renderDialog();
    document.getElementById("root").innerHTML=html;
    wireEvents();
  }

  function renderDialog(){
    return '<dialog id="lead-dialog">'
      +'<form method="dialog" id="lead-form">'
      +'<div class="dialog-head"><h2 id="dialog-title">Nuevo lead</h2><button type="button" class="close-x" data-action="close">×</button></div>'
      +'<div class="dialog-body"><div class="field-grid">'
        +field("Fecha","fecha","date")
        +field("WhatsApp","whatsapp","text")
        +field("Nombre","nombre","text")
        +field("Negocio","negocio","text")
        +field("Ciudad","ciudad","text")
        +selectField("Fuente","fuente",FUENTES)
        +selectField("Tipo","tipo",TIPOS)
        +selectField("Tiene web","tieneWeb",WEB_ESTADOS)
        +field("Instagram/FB","redes","text")
        +field("Resenas (rating y cantidad, o 'Sin resenas')","resenas","text")
        +selectField("Etapa","etapa",ETAPAS)
        +field("Score (0-50)","score","number")
        +field("Ultimo contacto","ultimoContacto","date")
        +field("Proxima fecha","proximaFecha","date")
        +selectField("Paquete propuesto","paquete",PAQUETES)
        +textareaField("Proxima accion","proximaAccion")
        +textareaFieldFull("Notas","notas")
      +'</div></div>'
      +'<div class="dialog-actions"><button type="button" class="btn btn-danger" id="dialog-delete" hidden>Eliminar</button>'
      +'<div class="dialog-actions-right"><button type="button" class="btn" data-action="close">Cancelar</button>'
      +'<button type="button" class="btn btn-primary" id="dialog-save">Guardar</button></div></div>'
      +'</form></dialog>';
  }

  function field(label,name,type){
    return '<div class="field"><label for="f-'+name+'">'+escapeHtml(label)+'</label>'
      +'<input id="f-'+name+'" name="'+name+'" type="'+type+'"'+(type==="number"?' min="0" max="50"':"")+'></div>';
  }
  function textareaField(label,name){
    return '<div class="field"><label for="f-'+name+'">'+escapeHtml(label)+'</label><textarea id="f-'+name+'" name="'+name+'"></textarea></div>';
  }
  function textareaFieldFull(label,name){
    return '<div class="field full"><label for="f-'+name+'">'+escapeHtml(label)+'</label><textarea id="f-'+name+'" name="'+name+'"></textarea></div>';
  }
  function selectField(label,name,options){
    return '<div class="field"><label for="f-'+name+'">'+escapeHtml(label)+'</label><select id="f-'+name+'" name="'+name+'">'
      +options.map(function(o){return '<option value="'+escapeHtml(o)+'">'+escapeHtml(o||"—")+'</option>'}).join("")
      +'</select></div>';
  }

  var editingId=null;

  function openDialog(lead){
    var dlg=document.getElementById("lead-dialog");
    var form=document.getElementById("lead-form");
    editingId=lead?lead.id:null;
    document.getElementById("dialog-title").textContent=lead?"Editar lead":"Nuevo lead";
    document.getElementById("dialog-delete").hidden=!lead;
    var defaults={fecha:todayIso(),nombre:"",negocio:"",ciudad:"",whatsapp:"",fuente:FUENTES[0],tipo:TIPOS[0],tieneWeb:WEB_ESTADOS[0],redes:"",resenas:"",notas:"",score:0,etapa:ETAPAS[0],ultimoContacto:"",proximaAccion:"",proximaFecha:"",paquete:""};
    var data=lead?Object.assign({},defaults,lead):defaults;
    Object.keys(defaults).forEach(function(k){
      var el=form.elements.namedItem(k);
      if(el)el.value=data[k]==null?"":data[k];
    });
    dlg.showModal();
  }

  function closeDialog(){
    document.getElementById("lead-dialog").close();
    editingId=null;
  }

  function saveDialog(){
    var form=document.getElementById("lead-form");
    var fd=new FormData(form);
    var lead={id:editingId||uid()};
    ["fecha","nombre","negocio","ciudad","whatsapp","fuente","tipo","tieneWeb","redes","resenas","notas","etapa","ultimoContacto","proximaAccion","proximaFecha","paquete"].forEach(function(k){
      lead[k]=String(fd.get(k)||"").trim();
    });
    var scoreVal=Number(fd.get("score"));
    lead.score=isNaN(scoreVal)?0:Math.max(0,Math.min(50,scoreVal));
    if(!lead.nombre&&!lead.negocio){showToast("Ponle al menos un nombre o un negocio.");return;}
    upsertLead(lead);
    closeDialog();
  }

  function wireEvents(){
    var root=document.getElementById("root");
    root.addEventListener("click",function(e){
      var btn=e.target.closest("[data-action]");
      if(!btn)return;
      var action=btn.getAttribute("data-action");
      var id=btn.getAttribute("data-id");
      if(action==="add")openDialog(null);
      if(action==="edit"){
        var lead=state.leads.find(function(l){return l.id===id});
        if(lead)openDialog(lead);
      }
      if(action==="delete")deleteLead(id);
      if(action==="export")exportCsv();
      if(action==="close")closeDialog();
    });
    root.addEventListener("change",function(e){
      if(e.target&&e.target.getAttribute("data-action")==="etapa"){
        e.target.setAttribute("style",etapaColors(e.target.value));
        setEtapa(e.target.getAttribute("data-id"),e.target.value);
      }
      if(e.target&&e.target.id==="etapa-filter"){
        ui.etapaFiltro=e.target.value;render();
      }
      if(e.target&&e.target.id==="ciudad-filter"){
        ui.ciudadFiltro=e.target.value;render();
      }
    });
    root.addEventListener("input",function(e){
      if(e.target&&e.target.id==="search-input"){
        ui.search=e.target.value;render();
        var el=document.getElementById("search-input");
        if(el){el.focus();var v=el.value;el.value=v;el.setSelectionRange(v.length,v.length);}
      }
    });
    var saveBtn=document.getElementById("dialog-save");
    if(saveBtn)saveBtn.addEventListener("click",saveDialog);
    var delBtn=document.getElementById("dialog-delete");
    if(delBtn)delBtn.addEventListener("click",function(){
      if(editingId){closeDialog();deleteLead(editingId);}
    });
  }

  function render(){renderApp();}

  window.claude&&window.claude.use&&window.claude.use("artifact").then(function(api){
    artifactApi=api;
  }).catch(function(){artifactApi=null;});

  render();
}
appMain(JSON.parse(document.getElementById("lyon-crm-data").textContent));
</script>
